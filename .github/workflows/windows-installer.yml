name: Windows Installer

on:
  pull_request:
    paths:
      - ".github/workflows/windows-installer.yml"
      - "installer/windows/**"
      - "modules/metadata.py"
      - "modules/**"
      - "media/**"
      - "locales/**"
      - "requirements.txt"
      - "run.py"
      - "tkinter_fix.py"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $metadata = Get-Content "modules/metadata.py" -Raw
          $match = [regex]::Match($metadata, "version\s*=\s*'([^']+)'")
          if (-not $match.Success) {
            throw "Could not read the app version from modules/metadata.py"
          }
          $version = $match.Groups[1].Value

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace "^v", ""
            if ($tagVersion -ne $version) {
              throw "Release tag v$tagVersion must match modules/metadata.py version $version"
            }
          }

          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$version" "installer\windows\Artesys-DLC.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $output = "installer\windows\Output"
          $installer = Join-Path $output "Artesys-DLC-Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not created: $installer"
          }

          $releaseFiles = Join-Path $output "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseFiles | Out-Null
          Copy-Item $installer $releaseFiles
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Artesys-DLC-Setup.exe" | Set-Content (Join-Path $releaseFiles "SHA256SUMS.txt") -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/windows/Output/release-assets/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Artesys-DLC-Setup.exe
            release-assets/SHA256SUMS.txt